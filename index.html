<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const sw = `
const CACHE='dieta-v1';
self.addEventListener('install',e=>{self.skipWaiting();});
self.addEventListener('activate',e=>{self.clients.claim();});
self.addEventListener('fetch',e=>{
  e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{
    const c=res.clone();
    caches.open(CACHE).then(cache=>cache.put(e.request,c));
    return res;
  })));
});`;
    const blob=new Blob([sw],{type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  });
}

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1D9E75;--green-light:#E1F5EE;--green-mid:#9FE1CB;
  --amber:#BA7517;--amber-light:#FAEEDA;
  --coral:#D85A30;--coral-light:#FAECE7;
  --blue:#185FA5;--blue-light:#E6F1FB;
  --gray:#5F5E5A;--gray-light:#F1EFE8;
  --text:#2C2C2A;--text-muted:#888780;
  --border:#D3D1C7;--bg:#FAFAF8;--white:#ffffff;
  --r:12px;--rs:8px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HERO */
.hero{background:var(--text);color:white;padding:2.5rem 2rem 2rem;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;border-radius:50%;border:40px solid rgba(255,255,255,.05)}
.hero-title{font-family:'DM Serif Display',serif;font-size:2rem;line-height:1.15;margin-bottom:.4rem;font-style:italic}
.hero-sub{font-size:.82rem;color:rgba(255,255,255,.5);margin-bottom:1.25rem}
.hero-stats{display:flex;gap:.6rem;flex-wrap:wrap}
.stat-pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:99px;padding:4px 13px;font-size:.75rem;color:rgba(255,255,255,.8)}
.stat-pill strong{color:white}

/* MACRO */
.macro-bar{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border)}
.macro-item{padding:.9rem 1rem;text-align:center;border-right:1px solid var(--border);background:var(--white)}
.macro-item:last-child{border-right:none}
.macro-val{font-size:1.35rem;font-weight:500;color:var(--text)}
.macro-lbl{font-size:.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

/* LAYOUT */
.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 210px)}

/* SIDEBAR */
.sidebar{border-right:1px solid var(--border);background:var(--white);padding:1.25rem 0}
.sidebar-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);padding:.6rem 1.1rem .25rem}
.nav-btn{width:100%;text-align:left;padding:.55rem 1.1rem;font-size:.82rem;font-family:'DM Sans',sans-serif;color:var(--text-muted);background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .12s}
.nav-btn:hover{color:var(--text);background:var(--gray-light)}
.nav-btn.active-day{color:var(--green);background:var(--green-light);font-weight:500}
.nav-btn.active-tab{color:var(--blue);background:var(--blue-light);font-weight:500}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--amber);display:inline-block}

/* MAIN */
.main{padding:1.5rem}
.panel{display:none}.panel.active{display:block}

/* DAY HEADER */
.day-header{display:flex;align-items:center;gap:.75rem;margin-bottom:1.1rem;padding-bottom:.7rem;border-bottom:1px solid var(--border)}
.day-title{font-family:'DM Serif Display',serif;font-size:1.5rem}
.sport-badge{background:var(--amber-light);color:var(--amber);font-size:.7rem;padding:3px 10px;border-radius:99px;font-weight:500}
.pizza-badge{background:var(--coral-light);color:var(--coral);font-size:.7rem;padding:3px 10px;border-radius:99px;font-weight:500}
.sport-info{background:var(--amber-light);border-radius:var(--rs);padding:.55rem .85rem;font-size:.76rem;color:var(--amber);margin-bottom:10px}

/* MEALS */
.meals{display:flex;flex-direction:column;gap:9px}
.meal-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:.95rem 1.15rem}
.meal-card.sport-pre{border-left:3px solid var(--amber)}
.meal-card.post-sport{border-left:3px solid var(--green)}
.meal-card.pizza-night{border-left:3px solid var(--coral)}
.meal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.55rem}
.meal-name{font-size:.86rem;font-weight:500;color:var(--text);display:flex;align-items:center;gap:6px}
.meal-meta{display:flex;align-items:center;gap:7px}
.meal-time{font-size:.7rem;color:var(--text-muted)}
.kcal-tag{font-size:.7rem;background:var(--gray-light);color:var(--gray);padding:2px 8px;border-radius:99px}
ul.ing{list-style:none}
ul.ing li{font-size:.8rem;color:var(--text-muted);padding:2px 0;display:flex;align-items:flex-start;gap:5px;line-height:1.4}
ul.ing li::before{content:'·';color:var(--green);font-weight:700;flex-shrink:0;margin-top:1px}
.alt-note{margin-top:6px;font-size:.73rem;color:var(--text-muted);background:var(--gray-light);padding:5px 9px;border-radius:var(--rs)}
.alt-note strong{color:var(--text)}
.day-total{display:flex;gap:7px;flex-wrap:wrap;margin-top:.6rem;padding-top:.7rem;border-top:1px solid var(--border)}
.total-chip{font-size:.7rem;padding:3px 10px;border-radius:99px;border:1px solid var(--border);color:var(--text-muted)}

/* SNACKS */
.panel-header{margin-bottom:1.15rem;padding-bottom:.7rem;border-bottom:1px solid var(--border)}
.panel-title{font-family:'DM Serif Display',serif;font-size:1.5rem}
.panel-sub{font-size:.8rem;color:var(--text-muted);margin-top:3px}
.section-label{font-size:.73rem;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin:1rem 0 .4rem}
.snacks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px;margin-bottom:1.25rem}
.snack-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:.85rem 1rem}
.snack-title{font-size:.83rem;font-weight:500;color:var(--text);margin-bottom:2px}
.snack-kcal{font-size:.7rem;color:var(--text-muted);margin-bottom:5px}
.snack-items{list-style:none}
.snack-items li{font-size:.76rem;color:var(--text-muted);padding:1px 0}
.snack-items li::before{content:'· ';color:var(--green);font-weight:700}

/* RECIPES */
.recipes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:13px;margin-top:.5rem}
.recipe-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.recipe-banner{padding:.9rem 1.15rem .55rem;background:var(--green-light)}
.recipe-category{font-size:.63rem;text-transform:uppercase;letter-spacing:.07em;color:var(--green);margin-bottom:3px}
.recipe-title{font-family:'DM Serif Display',serif;font-size:1.05rem;color:var(--text);line-height:1.25}
.recipe-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.recipe-tag{font-size:.66rem;padding:2px 7px;border-radius:99px;border:1px solid var(--green-mid);color:var(--green)}
.recipe-body{padding:.9rem 1.15rem}
.recipe-section{font-size:.68rem;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin:.55rem 0 .25rem}
.recipe-body ul{list-style:none}
.recipe-body ul li{font-size:.78rem;color:var(--text-muted);padding:1px 0}
.recipe-body ul li::before{content:'· ';color:var(--green);font-weight:700}
.recipe-steps{counter-reset:steps;list-style:none}
.recipe-steps li{counter-increment:steps;font-size:.78rem;color:var(--text-muted);padding:3px 0 3px 22px;position:relative;line-height:1.45}
.recipe-steps li::before{content:counter(steps);position:absolute;left:0;top:3px;width:15px;height:15px;background:var(--green);color:white;border-radius:50%;font-size:.58rem;display:flex;align-items:center;justify-content:center;font-weight:500}

/* TIPS */
.tips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px;margin-top:.5rem}
.tip-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:.85rem 1rem}
.tip-icon{font-size:1.2rem;margin-bottom:5px}
.tip-title{font-size:.83rem;font-weight:500;color:var(--text);margin-bottom:3px}
.tip-text{font-size:.76rem;color:var(--text-muted);line-height:1.5}

/* SHOPPING */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:9px;margin-top:.5rem}
.shop-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:.85rem 1rem}
.shop-title{font-size:.78rem;font-weight:500;color:var(--text);margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.shop-title+.shop-title{margin-top:10px}
.shop-items{list-style:none}
.shop-items li{font-size:.75rem;color:var(--text-muted);padding:2px 0}
.shop-items li::before{content:'☐ ';color:var(--green)}

@media(max-width:600px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:flex;flex-wrap:wrap;gap:4px;padding:.75rem;border-right:none;border-bottom:1px solid var(--border)}
  .sidebar-label{display:none}
  .nav-btn{width:auto;padding:4px 11px;border:1px solid var(--border);border-radius:99px;font-size:.73rem}
  .macro-bar{grid-template-columns:repeat(2,1fr)}
}

/* ===== iPhone / PWA specific ===== */
:root {
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
/* Evita il flash blu al tap su iOS */
* { -webkit-tap-highlight-color: transparent; }
/* Scroll elastico nativo */
body { -webkit-overflow-scrolling: touch; overscroll-behavior-y: none; }
.main { -webkit-overflow-scrolling: touch; }
/* Hero sotto la Dynamic Island / notch */
.hero { padding-top: calc(2.5rem + var(--sat)); }
/* Bottom safe area */
body::after {
  content: '';
  display: block;
  height: var(--sab);
}

/* BOTTOM TAB BAR — visibile solo su iPhone */
.bottom-nav {
  display: none;
}
@media (max-width: 600px) {
  .bottom-nav {
    display: flex;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(250,250,248,0.92);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    border-top: 0.5px solid var(--border);
    padding: 8px 0 calc(8px + var(--sab));
    z-index: 100;
    justify-content: space-around;
  }
  .bottom-nav button {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.6rem; color: var(--text-muted);
    padding: 4px 12px; border-radius: 8px;
    transition: all .12s;
  }
  .bottom-nav button .bn-icon { font-size: 1.3rem; line-height: 1; }
  .bottom-nav button.bn-active { color: var(--green); }
  /* Spinge il contenuto sopra la bottom nav */
  .layout { padding-bottom: calc(60px + var(--sab)); }
  /* Su mobile la sidebar diventa un pannello scorrevole orizzontale */
  .sidebar {
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .sidebar::-webkit-scrollbar { display: none; }
}

/* Splash screen interno (mostrato solo al primo avvio come PWA) */
#pwa-splash {
  display: none;
  position: fixed; inset: 0;
  background: var(--text);
  z-index: 999;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  animation: fadeOutSplash 0.4s ease 1.2s forwards;
}
#pwa-splash.show { display: flex; }
@keyframes fadeOutSplash {
  to { opacity: 0; pointer-events: none; }
}
#pwa-splash .splash-icon { font-size: 4rem; }
#pwa-splash .splash-title {
  font-family: 'DM Serif Display', serif;
  font-style: italic;
  font-size: 1.8rem;
  color: white;
}
#pwa-splash .splash-sub { font-size: 0.82rem; color: rgba(255,255,255,.45); }
</style>
</head>

}
function showTab(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>{b.classList.remove('active-day');b.classList.remove('active-tab')});
  document.getElementById('tab-'+id).classList.add('active');
  if(event && event.target) event.target.classList.add('active-tab');
  // Aggiorna bottom nav
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('bn-active'));
  const bn = document.getElementById('bn-'+id);
  if(bn) bn.classList.add('bn-active');
}
function bottomNav(id){
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('bn-active'));
  if(event && event.currentTarget) event.currentTarget.classList.add('bn-active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>{b.classList.remove('active-day');b.classList.remove('active-tab')});
  // Se è un giorno apri il giorno, altrimenti la tab
  const days = ['lun','mar','mer','gio','ven','sab','dom'];
  if(days.includes(id)){
    document.getElementById('day-'+id).classList.add('active');
    // Evidenzia nella sidebar
    document.querySelectorAll('.nav-btn').forEach(b=>{
      if(b.textContent.trim().toLowerCase().startsWith(id.substring(0,3))) b.classList.add('active-day');
    });
  } else {
    document.getElementById('tab-'+id).classList.add('active');
  }
  // Scroll to top
  window.scrollTo({top:0, behavior:'smooth'});
}

// Swipe orizzontale tra i giorni (iPhone)
const days = ['lun','mar','mer','gio','ven','sab','dom'];
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].screenX - touchStartX;
  if(Math.abs(dx) < 60) return;
  const active = document.querySelector('.panel.active');
  if(!active) return;
  const id = active.id;
  if(!id.startsWith('day-')) return;
  const cur = days.indexOf(id.replace('day-',''));
  if(cur === -1) return;
  const next = dx < 0 ? Math.min(cur+1, days.length-1) : Math.max(cur-1, 0);
  if(next !== cur){
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.querySelector('#day-'+days[next]).classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(b=>{b.classList.remove('active-day');b.classList.remove('active-tab')});
    document.querySelectorAll('.nav-btn').forEach(b=>{
      if(b.onclick && b.onclick.toString().includes("'"+days[next]+"'")){
        b.classList.add('active-day');
      }
    });
  }
}, {passive:true});
</script>
